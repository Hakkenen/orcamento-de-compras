<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">

        <header class="cabecalho">
            <h1>🛒 Orçamento de Compras</h1>
            <p>Acompanhe suas compras enquanto estiver no mercado.</p>
        </header>

        <section class="formulario-container">

            <form id="nova-compra">

                <div class="campo">
                    <label for="nome-produto">Produto</label>
                    <input type="text" id="nome-produto">
                </div>

                <div class="campo">
                    <label for="qtd-produto">Quantidade</label>
                    <input type="number" id="qtd-produto">
                </div>

                <div class="campo">
                    <label for="preco-produto">Preço</label>
                    <input type="number" id="preco-produto" step="0.01">
                </div>

                <div id="acoes-formulario">
                    <button type="submit" class="botao-adicionar" id="botao-principal">
                        + Adicionar produto
                    </button>

                    <button type="button" id="adicionar-cesta">
                        🛒 Adicionar cesta básica
                    </button>
                </div>

            </form>

        </section>


        <section class="total-container">

            <p>Total da compra</p>

            <strong>
                R$ <span id="total-compra">0.00</span>
            </strong>
            
            <br>

            <button id="gerar-pdf">Gerar PDF 📄</button>

            <button type="button" id="limpar-carrinho">
                🗑️ Limpar Carrinho
            </button>

        </section>

        <section class="itens-container">

            <h2>Itens da compra</h2>

            <div id="lista-produtos"></div>

        </section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
